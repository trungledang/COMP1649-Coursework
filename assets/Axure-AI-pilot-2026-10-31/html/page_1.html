<!DOCTYPE html>
<html>
  <head>
    <title>Page 1</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet"/>
    <link href="data/styles.css" type="text/css" rel="stylesheet"/>
    <link href="files/page_1/styles.css" type="text/css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>
    <script src="resources/scripts/axure/axQuery.js"></script>
    <script src="resources/scripts/axure/globals.js"></script>
    <script src="resources/scripts/axutils.js"></script>
    <script src="resources/scripts/axure/annotation.js"></script>
    <script src="resources/scripts/axure/axQuery.std.js"></script>
    <script src="resources/scripts/axure/doc.js"></script>
    <script src="resources/scripts/messagecenter.js"></script>
    <script src="resources/scripts/axure/events.js"></script>
    <script src="resources/scripts/axure/recording.js"></script>
    <script src="resources/scripts/axure/action.js"></script>
    <script src="resources/scripts/axure/expr.js"></script>
    <script src="resources/scripts/axure/geometry.js"></script>
    <script src="resources/scripts/axure/flyout.js"></script>
    <script src="resources/scripts/axure/model.js"></script>
    <script src="resources/scripts/axure/repeater.js"></script>
    <script src="resources/scripts/axure/sto.js"></script>
    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>
    <script src="resources/scripts/axure/math.js"></script>
    <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script>
    <script src="files/page_1/data.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
  </head>
  <body>
    <div id="base" class="">

      <!-- eyebrow (Rectangle) -->
      <div id="u0" class="ax_default paragraph transition notrs" data-label="eyebrow">
        <div id="u0_div" class=""></div>
        <div id="u0_text" class="text ">
          <p><span>AXURE / THỬ NGHIỆM TẠO FILE</span></p>
        </div>
      </div>

      <!-- heading (Rectangle) -->
      <div id="u1" class="ax_default paragraph transition notrs" data-label="heading">
        <div id="u1_div" class=""></div>
        <div id="u1_text" class="text ">
          <p><span>Chào bạn, bắt đầu nhé.</span></p>
        </div>
      </div>

      <!-- description (Rectangle) -->
      <div id="u2" class="ax_default paragraph transition notrs" data-label="description">
        <div id="u2_div" class=""></div>
        <div id="u2_text" class="text ">
          <p><span>Nhập tên để kiểm tra ô nhập, báo lỗi và chuyển trang.</span></p>
        </div>
      </div>

      <!-- name_label (Rectangle) -->
      <div id="u3" class="ax_default paragraph transition notrs" data-label="name_label">
        <div id="u3_div" class=""></div>
        <div id="u3_text" class="text ">
          <p><span>Tên của bạn</span></p>
        </div>
      </div>

      <!-- name_input (Text field) -->
      <div id="u4" class="ax_default text_field transition notrs" data-label="name_input">
        <div id="u4_div" class=""></div>
        <input id="u4_input" type="text" value="" class="u4_input"/>
      </div>

      <!-- feedback (Rectangle) -->
      <div id="u5" class="ax_default paragraph transition notrs" data-label="feedback">
        <div id="u5_div" class=""></div>
        <div id="u5_text" class="text " style="display:none; visibility: hidden">
          <p></p>
        </div>
      </div>

      <!-- continue (Html button) -->
      <div id="u6" class="ax_default transition notrs" data-label="continue">
        <div id="u6_div" class=""></div>
        <input id="u6_input" type="submit" value="Tiếp tục" class="u6_input"/>
      </div>

      <!-- reset (Html button) -->
      <div id="u7" class="ax_default transition notrs" data-label="reset">
        <div id="u7_div" class=""></div>
        <input id="u7_input" type="submit" value="Nhập lại" class="u7_input"/>
      </div>

      <!-- footer (Rectangle) -->
      <div id="u8" class="ax_default paragraph transition notrs" data-label="footer">
        <div id="u8_div" class=""></div>
        <div id="u8_text" class="text ">
          <p><span>Bản thử kỹ thuật &#149; Dữ liệu chỉ dùng trong prototype</span></p>
        </div>
      </div>
    </div>
    <script src="resources/scripts/axure/ios.js"></script>
  </body>
</html>
